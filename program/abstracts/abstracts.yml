- day-header: "Monday, 13 July"
  theme: "Democratic ideals and the field of political communication"
  type: "Keynote"
  time: "09:15–10:15"
  title: "Political Communication and Democratic Ideals: The Precarious Role of the Citizen"
  name: "Stephen Coleman"
  affiliation: "University of Leeds"
  href: "https://ahc.leeds.ac.uk/media/staff/240/professor-stephen-coleman"
  thumbnail: "../speakers/img/stephen.jpg"
  abstract: "Most scholars agree that liberal democracies are facing a contemporary crisis. Much attention has been paid to the destabilisation of political institutions, threats to traditional journalism, new sources of authoritative public knowledge and the rise of populist politicians. In this lecture we shall ask what all of this means for norms and practices of democratic citizenship? Is it meaningful to speak of a civic culture, public sphere or cohesive body of citizens? Can the concept and activity of citizenship survive the deep fractures of our time?"

- type: "Masterclass"
  time: "11:30–13:00"
  title: "What Has Political Communication Got to Do with Democracy?"
  name: "Regina Lawrence"
  affiliation: "University of Oregon"
  href: "https://journalism.uoregon.edu/directory/faculty-and-staff/all/rgl"
  thumbnail: "../speakers/img/regina.jpg"
  abstract: "At a time when democracy is challenged around the world, the field of political communication—and the whole endeavor of academic research and publishing—is challenged as well. This presentation is designed to raise questions and provoke discussion about the relevance of our work as a field. How are we addressing democracy and threats to democracy in our research? In our training of graduate students? Are the incentives and constraints around academic publishing conducive to research that grapples cohesively with democratic decline?"

- day-header: "Tuesday, 14 July"
  theme: "AI, algorithms, research methods and democratic citizenship"
  type: "Masterclass"
  time: "08:30–10:00"
  title: "How AI Is Transforming Research (Methods) in Political Communication"
  name: "Jörg Matthes"
  affiliation: "University of Vienna"
  href: "https://advertisingresearch.univie.ac.at/team/joerg-matthes/"
  thumbnail: "../speakers/img/joerg.jpg"
  abstract: "Artificial intelligence is rapidly transforming political communication research, reshaping not only the political information environments scholars seek to understand but also the methods used to study them. This talk examines how generative and analytical AI systems are changing the entire research process, from theory development and literature synthesis to research design, data collection, content analysis, experimentation, and scientific writing. Drawing on examples from automated analysis of political content, AI-generated experimental stimuli, large-scale analysis of digital trace data, simulation-based research, and hyperrealistic synthetic political media, the presentation highlights both the opportunities and the challenges that AI creates for the field. Particular attention is paid to questions of validity and replicability. Rather than advocating either uncritical adoption or outright rejection, the talk argues for a human-centered approach that combines methodological rigor with epistemic responsibility."

- type: "Masterclass"
  time: "11:30–13:00"
  title: "Algorithms, AI, and Power: Three Tensions for Democratic Citizenship"
  name: "Sebastián Valenzuela"
  affiliation: "Pontificia Universidad Católica de Chile"
  href: "https://comunicaciones.uc.cl/facultad/personas/sebastian-valenzuela-leighton/"
  thumbnail: "../speakers/img/sebastian.jpg"
  abstract: "Social-science research on algorithms and AI has largely been descriptive. This talk reframes the question around power: what kind of power is organized through these technologies? Building on Klinger's distinction between power of, through, and over algorithms, it analyzes algorithmic power through three structural tensions. First, agency versus structure: user agency persists but is conditioned by platform architectures. Second, opacity versus knowledge: as systems operate as black boxes, the problem shifts toward epistemic delegation, examined through an emerging construct—Belief in AI Sufficiency—associated with lower political knowledge. Third, innovation versus democracy: AI is legitimized as innovation while its effects are political, shown through Brazil's failed 'Fake News Bill' (PL 2630). Together these tensions form a coherent configuration of power with direct implications for political communication research."

- day-header: "Wednesday, 15 July"
  theme: "AI, populism and democratic communication"
  type: "Masterclass"
  time: "08:30–10:00"
  title: "Does AI Undermine Democracy?"
  name: "Claes de Vreese"
  affiliation: "University of Amsterdam"
  href: "https://www.uva.nl/en/profile/v/r/c.h.devreese/c.h.devreese.html"
  thumbnail: "../speakers/img/claes.jpg"
  abstract: "This lecture dives into the current research and knowledge on the effects of AI on the information ecosystem and democracy. It unpacks the implications for media and journalism on the one hand and elections and democracy on the other. It reviews emerging regulatory frameworks and ends with a number of unanswered questions."

- type: "Masterclass"
  time: "11:30–13:00"
  title: "Populist Communication and Democratic Ideals: New Directions in a Global Research Agenda"
  name: "Lone Sorensen"
  affiliation: "University of Leeds"
  href: "https://ahc.leeds.ac.uk/media/staff/3126/dr-lone-sorensen"
  thumbnail: "../speakers/img/lone.jpg"
  abstract: "This masterclass examines what the study of populist communication has taught us about democracy, political representation, and political communication, and considers where the field should go next. Tracing the evolution of populism research from early definitional debates to contemporary concerns about its democratic implications, the session reflects on the development of the populist communication approach and its contribution to understanding contemporary politics. Drawing on examples from across different political and media systems, it explores how populism intersects with democratic disaffection, polarisation, epistemic change, transnational political dynamics, and emerging forms of authoritarianism. The masterclass concludes by identifying major unresolved questions and emerging research agendas."

- day-header: "Thursday, 16 July"
  theme: "Misinformation, propaganda and public opinion"
  type: "Masterclass"
  time: "08:30–10:00"
  title: "Perceptions of Misinformation Exposure, Social Media, and AI: Mapping the Shifting Targets of Cynicism"
  name: "Dam Hee Kim"
  affiliation: "Korea University"
  href: "https://damheekim.wixsite.com/website"
  thumbnail: "../speakers/img/dam.jpg"
  abstract: "This masterclass talk demonstrates how perceptions of misinformation exposure can act as a catalyst for political cynicism, evolving from early social media landscapes into the current era of Generative AI. Charting a programmatic line of research, I will first share findings from a collaborative study, offering initial evidence that perceived exposure to misinformation initiates a path to political cynicism among American social media users. Based on a follow-up study, I will then discuss how cynicism toward politicians and the media expands to cynicism toward fellow citizens. Paradoxically, this path emerges most strongly among supposedly sophisticated citizens with a high need for cognition. Finally, in the Korean context, I will present preliminary insights into the ways GenAI complicates this epidemic by shifting the targets of cynicism."

- type: "Masterclass"
  time: "11:30–13:00"
  title: "Propaganda and Public Opinion as a Participatory Communication Process"
  name: "Christian Baden"
  affiliation: "The Hebrew University of Jerusalem"
  href: "https://christian-baden.huji.ac.il/"
  thumbnail: "../speakers/img/baden.jpg"
  abstract: "Political communication on digital media is fundamentally participatory, ever engulfed in countless voices chiming in to register opinions, offer information, amplify or contest others' contributions. At the same time, digital public debates remain riddled with profound power asymmetries, distortions and exclusionary mechanisms. In this masterclass, I shift perspectives to examine how unequal communication power, selective mobilization, precarious interactions and a multitude of dynamic feedback processes contribute to the negotiation of public opinion climates. I then discuss how contemporary propaganda exploits these processes to colonize public debates, mobilizing social pressure to subvert pluralistic discourse and delegitimize dissent."

- day-header: "Friday, 17 July"
  theme: "Elections, polarization and democratic interventions"
  type: "Masterclass"
  time: "08:30–10:00"
  title: "Social Media in U.S. Elections"
  name: "Talia Stroud"
  affiliation: "University of Texas at Austin"
  href: "https://commstudies.utexas.edu/faculty/natalie-jomini-stroud"
  thumbnail: "../speakers/img/talia.jpg"
  abstract: "This talk will be a high-level overview of research done as part of the 2020 U.S. Facebook and Instagram Election Study, including observational and experimental work published in 2023–2026 in a collaboration between U.S. academics and Meta. Observational work includes examinations of how people engage with political content on the platform. Experiments examine how algorithmic changes, deactivation from platforms, and changes to the ads seen affect political attitudes and behaviors. The talk will emphasize the four outcome variables: participation, (mis)information, polarization, and trust/legitimacy, paying particular attention to recently published results about the effects of political ads and deceptive online networks."

- type: "Masterclass"
  time: "11:30–13:00"
  title: "Examining the Causes and Responses to Polarization: From Media Triggers to Democratic Interventions"
  name: "Chris Fei Shen"
  affiliation: "City University of Hong Kong"
  href: "https://www.cityu.edu.hk/com/Profile.aspx?u=feishen"
  thumbnail: "../speakers/img/chris.jpg"
  abstract: "Political polarization is rarely the result of a single, isolated variable; rather, it operates within a dynamic, multi-layered communication ecosystem. This talk synthesizes recent empirical research to trace how macro-level media inputs—specifically affective news tone and complex framing structures—interact with micro-level psychological traits and social media affordances to accelerate ideological division. Moving beyond diagnostic analysis, the talk explores evidence-based remediation strategies, evaluating the efficacy of structural deliberation, fact-checking, and the traditional 'news diversity' standard in mitigating polarization. The research, largely contextualized within Hong Kong's intense period of social disturbance between 2014 and 2020, has significant implications for countries around the globe."
